<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Desk</title>
  <style>
    body { margin: 0; background: #0b0d12; color: #e8e8ee; font-family: system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 1rem; }
    button { font-size: 1.2rem; padding: .8rem 1.6rem; border: 1px solid #5b6cff; background: #1a1f3a;
             color: inherit; border-radius: 8px; cursor: pointer; }
    button:hover { background: #262d58; }
    #status { opacity: .7; font-size: .9rem; }
    footer { position: fixed; bottom: .5rem; font-size: .75rem; opacity: .5; }
  </style>
</head>
<body>
  <h1>The Desk</h1>
  <button id="start-audio" type="button">Start audio</button>
  <div id="status">Audio not started.</div>
  <footer>Historical replay of a hypothetical portfolio, for demonstration only.</footer>

  <script src="vendor/tone.js"></script>
  <script src="app.js"></script>
</body>
</html>
