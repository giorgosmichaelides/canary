<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canary</title>
  <style>
    body { margin: 0; background: #0b0d12; color: #e8e8ee; font-family: system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 1rem; }
    button { font-size: 1.2rem; padding: .8rem 1.6rem; border: 1px solid #5b6cff; background: #1a1f3a;
             color: inherit; border-radius: 8px; cursor: pointer; }
    button:hover { background: #262d58; }
    #status { opacity: .7; font-size: .9rem; }
    footer { position: fixed; bottom: .5rem; font-size: .75rem; opacity: .5; }
  </style>
</head>
<body>
  <h1>Canary</h1>
  <button id="start-audio" type="button">Start audio</button>
  <div id="status">Audio not started.</div>
  <label for="unison">Unison <output id="unison-readout">0.00</output></label>
  <input id="unison" type="range" min="0" max="1" step="0.01" value="0" style="width: min(480px, 80vw)">
  <label for="risk">Risk <output id="risk-readout">0.00</output></label>
  <input id="risk" type="range" min="0" max="1" step="0.01" value="0" style="width: min(480px, 80vw)">
  <label for="style">Style
    <select id="style">
      <option value="default" selected>Default</option>
      <option value="classical">Classical</option>
    </select>
  </label>
  <fieldset id="voices" style="border: 1px solid #333; border-radius: 8px;">
    <legend>Mute voices</legend>
    <label><input type="checkbox" data-voice="fx"> fx (bass, left)</label>
    <label><input type="checkbox" data-voice="havens"> havens (pad)</label>
    <label><input type="checkbox" data-voice="commodity"> commodity (rock, right)</label>
    <label><input type="checkbox" data-voice="contrarian"> contrarian (pluck)</label>
    <label><input type="checkbox" id="mute-risk"> risk (drone + click)</label>
  </fieldset>
  <div id="canary-chart"></div>
  <footer>Historical replay of a hypothetical portfolio, for demonstration only.</footer>

  <script src="vendor/tone.js"></script>
  <script src="music.js"></script>
  <script src="app.js"></script>
  <script src="chart.js"></script>
</body>
</html>
